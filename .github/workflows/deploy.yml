name: Deploy FintERP

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Determine Environment
        id: env-selector
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TARGET_ENV=Prod" >> $GITHUB_ENV
          else
            echo "TARGET_ENV=Dev" >> $GITHUB_ENV
          fi

      - name: Build & Synth IaC
        run: |
          npx turbo run build --filter=iac...
          cd packages/iac
          npx cdk synth -c env=${{ env.TARGET_ENV }}

      - name: Deploy Infrastructure
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          cd packages/iac
          npx cdk deploy --all --require-approval never -c env=${{ env.TARGET_ENV }}
